[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rythmicd"
version = "0.1.0"
description = "Rythmium-compatible server for Miqrochain"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Miqrochain Team" }
]
keywords = ["miqrochain", "rythmium", "blockchain", "cryptocurrency"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "asyncpg>=0.29.0",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "python-dotenv>=1.0.0",
    "orjson>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "asyncpg-stubs>=0.29.0",
]

[project.scripts]
rythmicd = "rythmicd.main:main"

[project.urls]
Homepage = "https://github.com/takumichronen/rythmicd_server"
Repository = "https://github.com/takumichronen/rythmicd_server"

[tool.hatch.build.targets.wheel]
packages = ["rythmicd"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
